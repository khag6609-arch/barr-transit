
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#326b8d" />
  <title>Barrie Transit — Student Monthly Pass</title>

  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>

  <main class="page">

    <section class="pass-card" aria-label="Student Monthly Pass">

      <p class="pass-type">Student Monthly Pass</p>

      <h1 class="pass-date">Loading date...</h1>

      <p class="pass-time">Loading time...</p>

      <p class="transit-name">Barrie Transit</p>

      <!-- VIDEO -->
      <div class="video-placeholder">
        <video
          id="busVideo"
          src="./videoooo.mp4"
          autoplay
          muted
          loop
          playsinline
          controls
          preload="metadata"
          aria-label="Barrie Transit bus video"
        >
          Your browser does not support HTML video.
        </video>
      </div>

      <button class="expire-button" type="button">
        Expire
      </button>

      <p class="expiry-copy">
        This pass expires after 85<br />
        minutes
      </p>

      <p class="user-id">
        User ID 100864817
      </p>

    </section>

  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav" aria-label="Main navigation">

    <a class="nav-item" href="#" aria-label="Home">
      <span class="nav-icon">
        <svg viewBox="0 0 64 64">
          <path d="M6 29 32 8l26 21M13 25v31h38V25M25 56V37h14v19"/>
        </svg>
      </span>
      <span>Home</span>
    </a>

    <a class="nav-item" href="#" aria-label="Parking">
      <span class="nav-icon">
        <svg viewBox="0 0 64 64">
          <path d="M32 8c-12 0-21 9-21 21v7h42v-7C53 17 44 8 32 8Z"/>
          <path d="M18 36v8c0 8 6 14 14 14s14-6 14-14v-8M32 58v5M32 17l-8 12h16l-8-12Z"/>
          <path d="M32 25v12"/>
        </svg>
      </span>
      <span>Parking</span>
    </a>

    <a class="nav-item active" href="#" aria-current="page" aria-label="Transit">
      <span class="nav-icon">
        <svg viewBox="0 0 64 64">
          <rect x="10" y="8" width="44" height="43" rx="5"/>
          <path d="M10 18h44M10 28h44M10 38h44M18 51v6m28-6v6M17 57h30M17 44h7m16 0h7"/>
          <circle cx="20" cy="50" r="3"/>
          <circle cx="44" cy="50" r="3"/>
        </svg>
      </span>
      <span>Transit</span>
    </a>

    <a class="nav-item" href="#" aria-label="Permits">
      <span class="nav-icon">
        <svg viewBox="0 0 64 64">
          <rect x="6" y="13" width="52" height="38" rx="5"/>
          <circle cx="21" cy="27" r="6"/>
          <path d="M11 43c2-7 18-7 20 0M37 25h14M37 32h14M37 39h10"/>
        </svg>
      </span>
      <span>Permits</span>
    </a>

  </nav>

</body>
</html>
